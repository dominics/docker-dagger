# Images are pinned as `tag@sha256:...`. The tag says what it is for a reader; the digest
# is what Docker actually enforces, and it is the only immutable half - a tag can be re-pushed
# to different bytes by anyone who takes over the publisher's account. `docker compose pull`
# therefore fetches exactly these bytes and cannot move a service underneath us.
#
# To take updates, resolve the new digests deliberately rather than by pulling a floating tag:
#
#   docker pull <image>:latest
#   docker image inspect <image>:latest \
#     --format '{{index .RepoDigests 0}} {{index .Config.Labels "org.opencontainers.image.version"}}'
#
# then paste tag and digest back in here. td-server is the deliberate exception - see its comment.

# Shared environment for both AIOStreams instances (LAN + tailnet). Anchored so the two
# services stay in lock-step on wiring; only BASE_URL / DB path / published port differ.
x-aiostreams-env: &aiostreams-env
  SECRET_KEY: ${AIOSTREAMS_SECRET_KEY:?Need to set AIOSTREAMS_SECRET_KEY (openssl rand -hex 32)}
  AIOSTREAMS_AUTH: ${AIOSTREAMS_AUTH:?Need to set AIOSTREAMS_AUTH (user:pass)}
  AIOSTREAMS_AUTH_ADMINS: ${AIOSTREAMS_AUTH_ADMINS:-}
  # NOTE: nzbdav credentials are NOT injected here. AIOStreams v2.30.2 stores env-supplied
  # service credentials (FORCED_SERVICE_CREDENTIALS / DEFAULT_SERVICE_CREDENTIALS) *encrypted*
  # and fails to decrypt them at resolve time — the ciphertext reaches `new URL()` → throws
  # "Invalid URL" → usenet plays a 21KB placeholder. Workaround: enter the nzbdav service
  # creds (url=http://nzbdav:3000, apiKey, WebDAV user/pass, aiostreamsAuth) by hand in each
  # AIOStreams config's UI — typed plaintext is encrypted once and decrypts cleanly. The
  # home-IP usenet guarantee does NOT depend on this: FORCE_PROXY_* below forces every stream
  # (incl. usenet) through the built-in proxy regardless. See CLAUDE.md / .env.example.
  # Indexer search over the compose network.
  BUILTIN_PROWLARR_URL: "http://prowlarr:9696"
  BUILTIN_PROWLARR_API_KEY: ${PROWLARR_API_KEY:?Need to set PROWLARR_API_KEY}
  # Force the built-in proxy for debrid/torrent streams too (egress from dagger).
  FORCE_PROXY_ENABLED: "true"
  FORCE_PROXY_ID: "builtin"
  FORCE_PROXY_CREDENTIALS: ${AIOSTREAMS_PROXY_CREDENTIALS:?Set a user:pass from AIOSTREAMS_AUTH for the built-in proxy}
  TZ: ${TZ}

services:
  traefik:
    image: traefik:v3.7.12@sha256:ef751c695afd26e2be41009047f651153dc1e61ace03e6d13f299d8c4be842b8
    ports:
      - "80:80"
      - "443:443"
      # Dashboard / API on loopback only — exposed to the tailnet via svc:traefik.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/etc/traefik/acme
      # The geoblock plugin is Go source fetched from plugins.traefik.io and compiled by
      # Yaegi at boot, not part of the image. Without this volume every restart re-downloads
      # it, and deploy-dagger restarts on every deploy: if that fetch fails, plugins are
      # disabled, geoblock-nz@file becomes an unknown middleware, and both statio.nz routers
      # fail to build. Observed once already. Persisting it makes the deploy independent of
      # a third-party download.
      - traefik-plugins:/plugins-storage
    environment:
      # Route53 DNS-01 challenge creds for the letsencrypt-dns resolver (lego route53
      # provider). Least-priv IAM user traefik-acme-route53 (terraform/varspool/iam.tf).
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for Route53 DNS-01}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for Route53 DNS-01}
      AWS_REGION:            ${AWS_REGION:-us-east-1}
      AWS_HOSTED_ZONE_ID:    ${AWS_HOSTED_ZONE_ID:?Set the varspool.com Route53 hosted zone ID}
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:4.0.19.2979-ls322@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ${CONFIG_DIR:?Need to set CONFIG_DIR}/sonarr:/config
      - ${STORAGE_DIR:?Need to set STORAGE_DIR}/tv:/tv
      - ${STORAGE_DIR}/downloads:/downloads
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ:?Need to set TZ}
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:6.3.0.10514-ls314@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${STORAGE_DIR}/movies:/movies
      - ${STORAGE_DIR}/downloads:/downloads
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ}
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40@sha256:c74c32408fdf6e7926ad62641fc1a5544206ee65c33f2188bb179edb30e28f5a
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      - ${CONFIG_DIR}/lidarr:/config
      - ${STORAGE_DIR}/music:/music
      - ${STORAGE_DIR}/downloads:/downloads
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ}
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls157@sha256:ab91301778251f82a31bbfc87f0497376d59e84439d9a1ceff6a61d594d1e3d7
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ}
    restart: unless-stopped

#  nzbget:
#    image: linuxserver/nzbget
#    ports:
#      - "6789:6789"
#    volumes:
#      - ${CONFIG_DIR}/nzbget:/config
#      - ${STORAGE_DIR}/downloads:/downloads
#      - ${STORAGE_DIR}/intermediate:/intermediate
#    environment:
#      PUID: ${PUID}
#      PGID: ${PGID}
#      TZ:   ${TZ}
#    labels:
#      traefik.frontend.rule: Host:nzbget.media.varspool.com

  # nzbdav: Usenet-as-WebDAV. Mounts NZBs without downloading; exposes a
  # SABnzbd-compatible API for the *arrs and a WebDAV endpoint for streaming
  # (used by AIOStreams for Stremio streaming). See github.com/nzbdav-dev/nzbdav.
  # An optional rclone sidecar can mount the WebDAV onto the host filesystem
  # so Sonarr/Radarr can import files directly; not enabled yet (Stremio path
  # doesn't need it).
  # Bound to loopback only; reached over the tailnet via svc:nzbdav and over the compose
  # network by the *arrs (http://nzbdav:3000) and AIOStreams. No LAN binding: under
  # AIOStreams the TV's Stremio streams flow through the aiostreams-lan built-in proxy
  # (which fetches from nzbdav internally), so nzbdav is never exposed on the LAN — the
  # usenet WebDAV is only reachable from dagger itself or the tailnet. nzbdav's built-in
  # username/password is the auth for the loopback/tailnet side.
  nzbdav:
    # No version tag published upstream; digest resolved from :latest on 2026-08-28.
    image: ghcr.io/nzbdav-dev/nzbdav@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${CONFIG_DIR}/nzbdav:/config
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ}
    restart: unless-stopped

  # Self-hosted AIOStreams — Stremio aggregator wired to our own nzbdav (usenet streaming)
  # + Prowlarr (indexers), replacing usenetstreamer. TWO instances because AIOStreams
  # builds every stream URL from a single BASE_URL (no request-host derivation): the TV
  # has no Tailscale client (LAN HTTP only), while the roaming phone reaches it over the
  # tailnet. Both share wiring via *aiostreams-env; behavioural config is set per-instance
  # in the UI (separate SQLite volumes).
  #
  # Usenet-IP guarantee: nzbdav holds the NNTP creds and does the fetching, so the provider
  # only ever sees dagger. FORCE_PROXY_ENABLED (above) forces every stream through the
  # built-in proxy, keeping WebDAV creds out of the URLs handed to clients and ensuring
  # usenet bytes egress only from dagger — independent of the per-config nzbdav.aiostreamsAuth.
  aiostreams-lan:
    image: ghcr.io/viren070/aiostreams@sha256:b169ccfb2b6f351f1bc5a8a460e4e102db77a11fb4fc58222e411d96b3adb85b
    # No host port publish: Traefik is the sole ingress, reaching this over the compose
    # network at http://aiostreams-lan:3000. Dropping the LAN bind also removes the
    # plain-HTTP exposure — clients must use the trusted-HTTPS Traefik endpoint, which
    # browser-based Stremio requires (an http addon is blocked as mixed content).
    environment:
      <<: *aiostreams-env
      # Trusted HTTPS via Traefik (Let's Encrypt over Route53 DNS-01). The name resolves
      # to ${LOCAL_IP} on the LAN, so traffic stays internal; Traefik terminates TLS and
      # proxies to this container. BASE_URL is baked into the proxied stream/manifest URLs,
      # so it must match exactly what the client will use.
      BASE_URL: "https://aiostreams.media.varspool.com"
      DATABASE_URI: "sqlite:///app/data/db.sqlite"
    volumes:
      - ${CONFIG_DIR}/aiostreams-lan:/app/data
    restart: unless-stopped

  # Tailnet instance for the roaming phone. Loopback-only bind; Tailscale Serve
  # (svc:aiostreams) terminates HTTPS and proxies to 127.0.0.1:8084.
  aiostreams-ts:
    image: ghcr.io/viren070/aiostreams@sha256:b169ccfb2b6f351f1bc5a8a460e4e102db77a11fb4fc58222e411d96b3adb85b
    ports:
      - "127.0.0.1:8084:3000"
    environment:
      <<: *aiostreams-env
      BASE_URL: "https://aiostreams.royal-shark.ts.net"
      DATABASE_URI: "sqlite:///app/data/db.sqlite"
    volumes:
      - ${CONFIG_DIR}/aiostreams-ts:/app/data
    restart: unless-stopped

  # Transparent reddit reverse-proxy. Exists so xeno.video (on shank) can read reddit's
  # own RSS from dagger's residential IP — Reddit blocks shank's datacenter IP. Replaced
  # the Redlib front-end, which broke when Reddit started 403ing its spoofed-OAuth `.json`
  # calls; plain `.rss` still works. The service name stays `redlib` so Tailscale Serve
  # (svc:redlib → https://redlib.royal-shark.ts.net) and the loopback bind are unchanged.
  # nginx forwards reddit's bytes verbatim (no URL rewriting), so the feed never references
  # this proxy host. See redlib-proxy/nginx.conf for the load-bearing browser User-Agent.
  redlib:
    image: nginx:alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913  # 1.31.4
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./redlib-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.2-ls270@sha256:13d4404f1242f819e0cc2e294def5858def251a3609eb59404dad303075a564a
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ${CONFIG_DIR}/sabnzbd:/config
      - ${STORAGE_DIR}/downloads:/downloads
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ:   ${TZ}
    restart: unless-stopped

#  qbittorrent:
#    image: lscr.io/linuxserver/qbittorrent:latest
#    environment:
#      PUID: ${PUID}
#      PGID: ${PGID}
#      TZ:   ${TZ}
#      WEBUI_PORT: 8082
#      TORRENTING_PORT: 44881
#    volumes:
#      - ${CONFIG_DIR}/qbittorrent:/config
#      - ${STORAGE_DIR}/downloads:/downloads
#    ports:
#      - "100.87.71.30:8082:8082"
#      - "44881:44881"
#      - "44881:44881/udp"
#    labels:
#      traefik.enable: "true"
#      traefik.http.routers.qbittorrent.rule: "Host(`qbit.media.varspool.com`)"
#      traefik.http.routers.qbittorrent.tls: "true"
#      traefik.http.routers.qbittorrent.entrypoints: "websecure"
#      traefik.http.routers.qbittorrent.middlewares: "tailscale-only@file"
#      traefik.http.services.qbittorrent.loadbalancer.server.port: "8082"
#    restart: unless-stopped

 # Plex runs in host network mode so it stays reachable on the LAN (192.168.1.x:32400)
 # without Tailscale. svc:plex (configured in tailscale/serve.json) provides HTTPS to
 # tailnet clients on top of that.
  plex:
    image: linuxserver/plex:1.43.3.10896-cb3ebc72d-ls321@sha256:f6c58cb2f5e41cd1397bf2ed4e61ef63bd86e0736841b3ef426fabfe04606293
    runtime: nvidia
    network_mode: "host"
    volumes:
      - ${CONFIG_DIR}/plex:/config
      - ${STORAGE_DIR}/movies:/data/movies
      - ${STORAGE_DIR}/tv:/data/tv
      - ${STORAGE_DIR}/transcode:/transcode
      - /dev/dri:/dev/dri
    environment:
      VERSION: public
      PUID: ${PUID}
      PGID: ${PGID}
      NVIDIA_VISIBLE_DEVICES: all
    restart: unless-stopped

  # Jellyfin serves the same library as Plex, on the same host. Host network mode
  # for the same reason Plex uses it (the LG TV has no tailnet client and needs the
  # LAN address) and additionally so the 7359/udp discovery broadcast reaches
  # clients, which is how the webOS app finds the server without being told an IP.
  # svc:jellyfin provides tailnet HTTPS on top, as svc:plex does for Plex.
  #
  # Its own transcode directory rather than Plex's, so two servers scratching at
  # once cannot collide.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls46@sha256:4f6d8dfc53ec5a1ddf7a90e4338972d57d7b0adff6dc88b53184f8285d0b594f
    runtime: nvidia
    network_mode: "host"
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${STORAGE_DIR}/movies:/data/movies
      - ${STORAGE_DIR}/tv:/data/tv
      - ${STORAGE_DIR}/transcode/jellyfin:/transcode
      - /dev/dri:/dev/dri
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
      JELLYFIN_PublishedServerUrl: ${LOCAL_IP}
    restart: unless-stopped


  # TrageD (ws.traged.commo.nz) — the game server for traged.commo.nz, whose
  # static client is served from sabre. It lives here because a 30Hz
  # authoritative world wants room: this host has twelve cores and 31GiB against
  # sabre's one and 956MiB, and being in Auckland it is also the nearest host to
  # the players.
  #
  # PUBLIC, deliberately and unlike everything else here — no tailscale-only
  # middleware. That means a public game route on the residential line: anyone
  # flooding it takes out the house, not just the game. Chosen knowingly.
  #
  # Image built and pushed by dominics/td's deploy workflow; rolled by the
  # traged-deploy account deploy-dagger installs.
  #
  # Deliberately NOT digest-pinned, unlike everything else here. The floating tag
  # is the mechanism by which CI ships a new build: pinning it would make every
  # future push a no-op and quietly break the deploy. The supply-chain argument
  # for pinning is about third-party publishers; this image is our own CI.
  td-server:
    image: ghcr.io/dominics/td-server:latest
    # No published ports: Traefik reaches it over the compose network, so the
    # game port is not independently addressable even on the LAN.
    environment:
      TD_LISTEN: "0.0.0.0:5001"
      # Where the world is kept across a restart. Without this the server keeps
      # nothing, which is what a checkout gets and what this host got until the
      # deploy started costing everybody their maze.
      TD_SAVE: "/var/lib/td/world.save"
    volumes:
      - td-world:/var/lib/td
    labels:
      traefik.enable: "true"
      traefik.http.routers.traged.rule: "Host(`ws.traged.commo.nz`)"
      traefik.http.routers.traged.entrypoints: "websecure"
      traefik.http.routers.traged.tls: "true"
      # HTTP-01 like statio.nz, not the DNS-01 resolver: this name resolves to a
      # public address, and the DNS-01 creds here are scoped to varspool.com.
      traefik.http.routers.traged.tls.certresolver: "letsencrypt"
      traefik.http.services.traged.loadbalancer.server.port: "5001"
    # A wedged process is replaced. It saves every thirty seconds and again on
    # the SIGTERM that stopping it sends, so a restart costs at most the last
    # half-minute and usually nothing. `up -d --wait` blocks on this, which is
    # what stops a deploy returning while Traefik still has no backend to route
    # to.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5001' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Roomy next to the other options, but this box also runs Plex transcodes.
    # Capped so a runaway world is killed by itself rather than competing with
    # the thing the house actually notices.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped


volumes:
  traefik-acme:
  # Downloaded+compiled Traefik plugins (geoblock). See the traefik service comment.
  traefik-plugins:
  # The TrageD world. Named rather than a bind mount because nothing outside the
  # container ever reads it, and a stray deploy-time chown is how bind mounts go
  # wrong.
  td-world:
