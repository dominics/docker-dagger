# Immich - self-hosted photo library (dagger).
#
# Adapted from the official release compose:
#   https://github.com/immich-app/immich/releases/download/v3.1.0/docker-compose.yml
# When bumping IMMICH_VERSION in .env, re-fetch the matching release compose and
# re-apply the two local changes below, then read the release notes for breaking
# DB migrations before `docker compose up`.
#
# Local changes vs upstream:
#   1. immich-server port is bound to 127.0.0.1 only - no LAN/public exposure.
#      Reach it via SSH tunnel (`ssh -L 2283:localhost:2283 dagger`) for now.
#   2. Storage split (see .env): UPLOAD_LOCATION on the mergerfs pool, but
#      DB_DATA_LOCATION on a real ext4 disk - Postgres must never live on FUSE.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not edit the next line. Change the media storage location via UPLOAD_LOCATION in .env.
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # CPU-only inference on dagger (no GPU). First index of a large import is slow; that is expected.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if DB_DATA_LOCATION ever lands on spinning disk rather than SSD.
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. Change the DB storage location via DB_DATA_LOCATION in .env.
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
