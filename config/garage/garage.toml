# Garage, a single-node S3 store. Its one job so far is the shared sccache
# bucket the Macs build against (svc:garage). rpc_secret and admin_token come
# from GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN in .env, not from this file.

# Metadata is small and wants a real filesystem for LMDB; the objects go to
# the storage pool.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# One node, so one copy. A cache can always be rebuilt.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
