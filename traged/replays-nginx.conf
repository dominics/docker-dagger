# The last day of TrageD play, as td-server records it under TD_REPLAYS, for
# the browser client's replay mode. Read-only: the volume is mounted :ro, and
# nothing but /replays/ is served. See td's docs/2026-11-04-replays-design.md.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /srv/td;
    autoindex off;

    # The page is on traged.commo.nz and fetches from ws.traged.commo.nz.
    add_header Access-Control-Allow-Origin "*" always;

    types { }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/octet-stream;

    location / {
        return 404;
    }

    # Rewritten each time a chunk is written, so never cached.
    location = /replays/index.tdindex {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # Written once under a name of their own and never changed.
    location ~ ^/replays/[0-9]+-[0-9]+\.tdreplay$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }
}
